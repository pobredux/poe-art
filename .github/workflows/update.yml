name: update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild both games even if the patch has not changed
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      ART_BASE_URL: ${{ vars.ART_BASE_URL }}
      GGPK_EXPLORER_VERSION: v1.11.3
      DAT_SCHEMA: /tmp/schema.min.json
      FORCE: ${{ inputs.force && '--force' || '' }}
    steps:
      # GitHub disables schedules in public repos after 60 days without commits; enabling resets that clock.
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - id: check
        run: bun src/update.ts --check $FORCE

      - name: Install ggpk-explorer and the dat schema
        if: steps.check.outputs.stale != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GGPK_EXPLORER_VERSION" -R juddisjudd/ggpk-explorer -D /tmp/ggpk -p "*linux-x64.deb" -p SHA256SUMS.txt
          (cd /tmp/ggpk && grep linux-x64.deb SHA256SUMS.txt | sha256sum -c -)
          sudo apt-get install -y /tmp/ggpk/*.deb
          curl -fsSL -o "$DAT_SCHEMA" https://github.com/poe-tool-dev/dat-schema/releases/latest/download/schema.min.json

      - id: update
        if: steps.check.outputs.stale != ''
        run: bun src/update.ts ${{ steps.check.outputs.stale }} $FORCE

      - name: Commit maps
        if: steps.check.outputs.stale != ''
        run: |
          git add maps
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "maps: ${{ steps.update.outputs.published }}"
          git push
